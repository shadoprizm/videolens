<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">VideoLens Chrome extension producing a professional video report</title>
  <desc id="desc">A YouTube-style video sits beside the VideoLens report panel with a detailed summary and timestamped findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#13283d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1055" cy="75" r="170" fill="#0891b2" opacity=".11"/>
  <circle cx="90" cy="640" r="230" fill="#2563eb" opacity=".10"/>

  <g transform="translate(70 55)">
    <rect width="1060" height="565" rx="24" fill="#f8fafc" filter="url(#shadow)"/>
    <rect width="1060" height="58" rx="24" fill="#ffffff"/>
    <path d="M0 58h1060" stroke="#dbe4ef"/>
    <circle cx="27" cy="29" r="6" fill="#fb7185"/>
    <circle cx="47" cy="29" r="6" fill="#fbbf24"/>
    <circle cx="67" cy="29" r="6" fill="#34d399"/>
    <rect x="96" y="17" width="405" height="24" rx="12" fill="#eef2f7"/>
    <text x="116" y="34" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">youtube.com/watch?v=...</text>
    <rect x="863" y="14" width="174" height="30" rx="9" fill="#0f172a"/>
    <text x="885" y="34" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">VideoLens side panel</text>

    <g transform="translate(24 83)">
      <rect width="620" height="349" rx="16" fill="#0b1220"/>
      <rect x="18" y="18" width="584" height="313" rx="12" fill="#15263a"/>
      <path d="M18 248c115-79 195-42 280-101 88-62 183-72 304-18v202H18z" fill="#1e3a4d"/>
      <path d="M18 288c112-58 223-20 326-72 97-49 175-43 258-8v123H18z" fill="#28536a"/>
      <circle cx="310" cy="166" r="42" fill="#020617" opacity=".72"/>
      <path d="M298 144l34 22-34 22z" fill="#ffffff"/>
      <rect x="18" y="307" width="584" height="24" rx="8" fill="#020617" opacity=".78"/>
      <rect x="34" y="318" width="390" height="4" rx="2" fill="#334155"/>
      <rect x="34" y="318" width="151" height="4" rx="2" fill="#22d3ee"/>
      <circle cx="185" cy="320" r="6" fill="#ffffff"/>
      <text x="493" y="323" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="10">08:14 / 31:06</text>
      <text x="2" y="382" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">How durable systems preserve the signal</text>
      <text x="2" y="407" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">Long-form tutorial · 31 minutes</text>
    </g>

    <g transform="translate(670 83)">
      <rect width="366" height="454" rx="16" fill="#ffffff" stroke="#dbe4ef"/>
      <rect width="366" height="70" rx="16" fill="#0f172a"/>
      <rect y="54" width="366" height="16" fill="#0f172a"/>
      <rect x="20" y="18" width="34" height="34" rx="10" fill="url(#accent)"/>
      <text x="30" y="40" fill="#07111f" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900">VL</text>
      <text x="67" y="32" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">VideoLens report</text>
      <text x="67" y="50" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">Detailed report · evidence ready</text>
      <circle cx="337" cy="34" r="5" fill="#34d399"/>

      <text x="22" y="104" fill="#0891b2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4">EXECUTIVE SUMMARY</text>
      <text x="22" y="130" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">A report worth keeping.</text>
      <rect x="22" y="149" width="306" height="7" rx="3.5" fill="#dbe4ef"/>
      <rect x="22" y="166" width="319" height="7" rx="3.5" fill="#e5eaf0"/>
      <rect x="22" y="183" width="274" height="7" rx="3.5" fill="#e5eaf0"/>

      <text x="22" y="224" fill="#0891b2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4">KEY FINDINGS</text>
      <g transform="translate(22 240)">
        <rect width="322" height="59" rx="11" fill="#f1f5f9"/>
        <rect x="11" y="12" width="50" height="21" rx="10.5" fill="#cffafe"/>
        <text x="20" y="27" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">04:18</text>
        <text x="72" y="26" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Core thesis established</text>
        <rect x="72" y="38" width="222" height="5" rx="2.5" fill="#cbd5e1"/>
      </g>
      <g transform="translate(22 309)">
        <rect width="322" height="59" rx="11" fill="#f1f5f9"/>
        <rect x="11" y="12" width="50" height="21" rx="10.5" fill="#dbeafe"/>
        <text x="20" y="27" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">12:42</text>
        <text x="72" y="26" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Visual example confirms it</text>
        <rect x="72" y="38" width="203" height="5" rx="2.5" fill="#cbd5e1"/>
      </g>
      <rect x="22" y="390" width="156" height="40" rx="11" fill="#0f172a"/>
      <text x="47" y="415" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Open full report</text>
      <rect x="188" y="390" width="156" height="40" rx="11" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="229" y="415" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Export</text>
    </g>
  </g>
</svg>
