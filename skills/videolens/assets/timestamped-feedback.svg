<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Professional VideoLens report with timestamped evidence</title>
  <desc id="desc">A polished written report shows an executive summary, findings, timestamps, practical takeaways, and export formats.</desc>
  <defs>
    <linearGradient id="pagebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f6fb"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#143b56"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#334155" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#pagebg)"/>
  <g transform="translate(170 32)" filter="url(#shadow)">
    <rect width="860" height="610" rx="18" fill="#ffffff"/>
    <rect width="860" height="170" rx="18" fill="url(#hero)"/>
    <rect y="152" width="860" height="18" fill="url(#hero)"/>
    <rect x="48" y="38" width="42" height="42" rx="12" fill="#22d3ee"/>
    <text x="60" y="64" fill="#07111f" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900">VL</text>
    <text x="105" y="54" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">VIDEOLENS</text>
    <text x="105" y="72" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.2">PROFESSIONAL VIDEO REPORT</text>
    <text x="48" y="115" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">How durable systems preserve the signal</text>
    <text x="48" y="142" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="12">Detailed written report · transcript + visual evidence · 31:06</text>
    <rect x="690" y="42" width="122" height="34" rx="17" fill="#ffffff" opacity=".10"/>
    <text x="718" y="64" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">HIGH CONFIDENCE</text>

    <g transform="translate(48 204)">
      <text fill="#0891b2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">EXECUTIVE SUMMARY</text>
      <text y="33" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">The central argument, without the filler.</text>
      <rect y="52" width="734" height="7" rx="3.5" fill="#dbe4ef"/>
      <rect y="69" width="760" height="7" rx="3.5" fill="#e5eaf0"/>
      <rect y="86" width="711" height="7" rx="3.5" fill="#e5eaf0"/>
    </g>

    <g transform="translate(48 332)">
      <text fill="#0891b2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">KEY FINDINGS AND EVIDENCE</text>
      <g transform="translate(0 22)">
        <rect width="366" height="94" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
        <rect x="16" y="16" width="55" height="23" rx="11.5" fill="#cffafe"/>
        <text x="27" y="32" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800">04:18</text>
        <text x="84" y="33" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">The thesis becomes explicit</text>
        <rect x="16" y="55" width="316" height="6" rx="3" fill="#cbd5e1"/>
        <rect x="16" y="71" width="274" height="6" rx="3" fill="#d7dee7"/>
      </g>
      <g transform="translate(386 22)">
        <rect width="378" height="94" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
        <rect x="16" y="16" width="55" height="23" rx="11.5" fill="#dbeafe"/>
        <text x="27" y="32" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800">12:42</text>
        <text x="84" y="33" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">The visual proof arrives</text>
        <rect x="16" y="55" width="330" height="6" rx="3" fill="#cbd5e1"/>
        <rect x="16" y="71" width="247" height="6" rx="3" fill="#d7dee7"/>
      </g>
    </g>

    <g transform="translate(48 485)">
      <rect width="500" height="82" rx="14" fill="#ecfeff"/>
      <text x="18" y="25" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="1.3">PRACTICAL TAKEAWAYS</text>
      <circle cx="24" cy="49" r="4" fill="#06b6d4"/>
      <rect x="38" y="46" width="403" height="6" rx="3" fill="#9bd8e2"/>
      <circle cx="24" cy="66" r="4" fill="#06b6d4"/>
      <rect x="38" y="63" width="350" height="6" rx="3" fill="#b3e3ea"/>
      <g transform="translate(526 0)">
        <rect width="238" height="82" rx="14" fill="#0f172a"/>
        <text x="18" y="26" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">EXPORT</text>
        <rect x="18" y="42" width="48" height="24" rx="8" fill="#ffffff" opacity=".12"/>
        <rect x="76" y="42" width="48" height="24" rx="8" fill="#ffffff" opacity=".12"/>
        <rect x="134" y="42" width="48" height="24" rx="8" fill="#ffffff" opacity=".12"/>
        <rect x="192" y="42" width="28" height="24" rx="8" fill="#ffffff" opacity=".12"/>
        <text x="30" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">HTML</text>
        <text x="91" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">PDF</text>
        <text x="144" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">MD</text>
        <text x="197" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">{ }</text>
