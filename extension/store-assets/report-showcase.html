<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoLens professional report</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { display:grid; grid-template-columns:390px 1fr; gap:48px; padding:48px 46px; color:#f8fafc; background:radial-gradient(circle at 90% 5%,rgba(6,182,212,.22),transparent 30%),linear-gradient(135deg,#061221,#101d39 65%,#18205e); }
    body::before { position:absolute; inset:0; opacity:.07; content:""; background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px); background-size:48px 48px; }
    .copy { position:relative; z-index:1; align-self:center; }
    .brand { display:flex; align-items:center; gap:11px; margin-bottom:82px; }
    .brand img { width:39px; height:39px; border-radius:10px; }.brand strong { font-size:20px; }
    .kicker { margin-bottom:14px; color:#67e8f9; font-size:10px; font-weight:800; letter-spacing:.17em; }
    h1 { margin:0; font-size:44px; line-height:1.03; letter-spacing:-.045em; }
    p { margin:20px 0 0; color:#aebdd0; font-size:15px; line-height:1.65; }
    .formats { display:flex; gap:8px; margin-top:28px; }.formats span { padding:7px 10px; border:1px solid rgba(255,255,255,.14); border-radius:999px; color:#cbd5e1; background:rgba(255,255,255,.05); font-size:10px; font-weight:700; }
    .report-window { position:relative; z-index:1; overflow:hidden; border:1px solid rgba(255,255,255,.22); border-radius:16px; background:white; box-shadow:0 28px 80px rgba(2,6,23,.55); }
    .window-bar { height:42px; display:flex; align-items:center; gap:7px; padding:0 15px; border-bottom:1px solid #dbe4ed; background:#f8fafc; }
    .window-bar i { width:9px; height:9px; border-radius:50%; background:#cbd5e1; }.window-bar i:first-child{background:#fb7185}.window-bar i:nth-child(2){background:#fbbf24}.window-bar i:nth-child(3){background:#34d399}
    .window-title { margin-left:16px; color:#94a3b8; font-size:10px; }
    iframe { display:block; width:100%; height:calc(100% - 42px); border:0; background:#e9eff5; }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand"><img src="../public/icons/icon128.png" alt=""><strong>VideoLens</strong></div>
    <div class="kicker">PROFESSIONAL EXPORT</div>
    <h1>A report worth sharing.</h1>
    <p>Self-contained HTML with a polished, print-ready layout. Open it anywhere or save a beautiful PDF directly from Chrome.</p>
    <div class="formats"><span>HTML</span><span>PDF</span><span>Markdown</span><span>JSON</span></div>
  </section>
  <section class="report-window">
    <div class="window-bar"><i></i><i></i><i></i><span class="window-title">sample-report-videolens.html</span></div>
    <iframe src="../dist/sidepanel.html?preview=report" title="VideoLens professional report"></iframe>
  </section>
</body>
</html>
