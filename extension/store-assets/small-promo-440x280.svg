    <rect x="16" y="20" width="197" height="4" rx="2" fill="url(#timeline)"/>
    <circle cx="82" cy="22" r="7" fill="#22D3EE" stroke="#DFFAFE" stroke-width="3"/>
    <circle cx="157" cy="22" r="7" fill="#60A5FA" stroke="#DBEAFE" stroke-width="3"/>
    <circle cx="235" cy="22" r="7" fill="#818CF8" stroke="#E0E7FF" stroke-width="3"/>
    <text x="294" y="26" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">02:41</text>
