<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">VideoLens — AI Video Analysis</title>
  <desc id="desc">Chrome Web Store small promotional tile for VideoLens.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="22" x2="416" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182B"/>
      <stop offset="0.52" stop-color="#0B2B42"/>
      <stop offset="1" stop-color="#18236A"/>
    </linearGradient>
    <linearGradient id="brand" x1="52" y1="39" x2="108" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="timeline" x1="45" y1="0" x2="382" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="440" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="385" cy="40" r="72" fill="#6366F1" opacity=".16" filter="url(#glow)"/>
  <circle cx="52" cy="247" r="58" fill="#06B6D4" opacity=".14" filter="url(#glow)"/>

  <g opacity=".12" stroke="#E0F2FE">
    <path d="M303 0v280M343 0v280M383 0v280M423 0v280"/>
    <path d="M0 202h440M0 242h440"/>
  </g>

  <g transform="translate(42 34)">
    <rect width="58" height="58" rx="16" fill="url(#brand)"/>
    <path d="M24 17.5v23l19-11.5-19-11.5Z" fill="white"/>
  </g>
  <text x="116" y="60" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-.5">VideoLens</text>
  <text x="116" y="83" fill="#A5F3FC" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1.3">AI VIDEO ANALYSIS</text>

  <text x="42" y="137" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="-.4">Turn any video into</text>
  <text x="42" y="169" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="-.4">evidence you can act on.</text>

  <g transform="translate(42 198)">
